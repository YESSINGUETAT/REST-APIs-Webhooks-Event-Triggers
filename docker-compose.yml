version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: property_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.40.0
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/property_management
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecret
      HASURA_GRAPHQL_DEV_MODE: "true"
      EVENT_SECRET: my_event_secret_123

  mock-payment-service:
    build:
      context: ./mock-payment-service
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      API_KEY: test_api_key_12345
      WEBHOOK_SECRET: whsec_mock_secret_abcdef
      WEBHOOK_URL: http://next-app:3000/api/webhooks/payments

  next-app:
    build:
      context: ./property-app
    ports:
      - "3000:3000"
    depends_on:
      - hasura
      - mock-payment-service
    environment:
      PAYMENT_SERVICE_URL: http://mock-payment-service:4000
      PAYMENT_API_KEY: test_api_key_12345
      WEBHOOK_SECRET: whsec_mock_secret_abcdef
      HASURA_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: myadminsecret
      EVENT_SECRET: my_event_secret_123
      NEXT_PUBLIC_HASURA_URL: http://localhost:8080/v1/graphql
      NEXT_PUBLIC_HASURA_ADMIN_SECRET: myadminsecret

volumes:
  pgdata: